          RULES
          echo "Loaded $n rule files"
          echo "CS_RULE_FILES=$n" >> "$GITHUB_ENV"
          # JSON to a file and nothing to stdout: Opengrep's text output prints
          # the matched lines, which for a secret rule is the secret.
          rc=0
          opengrep scan --config "$rules" --json --output "$out/opengrep.json" \
            --sarif-output "$out/opengrep.sarif" --disable-version-check \
            --exclude node_modules --exclude dist --exclude .terraform --exclude vendor \
            . > /dev/null || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::opengrep exited $rc"; exit "$rc"; }
          # Working tree only (the history is not checked out). --redact keeps
          # any match out of the log and the report file.
          gitleaks dir . --no-banner --redact --exit-code 0 --log-level warn \
            --report-format json --report-path "$out/gitleaks.json" > /dev/null
          [ -s "$out/gitleaks.json" ] || echo '[]' > "$out/gitleaks.json"

      - name: Summarise
        id: summarise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/code-security"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          default_branch=$(curl -fsS "${auth[@]}" "$api" | jq -r .default_branch)
          # The previous report comes only from a TRUSTED run, the same rule the
          # exporter applies: this workflow file, completed, on this repo's own
          # default branch, started by push, schedule or workflow_dispatch, head
          # repo = this repo. A fork PR's branch can be called main too; its
          # artifact must never seed first_seen. curl drops the Authorization
          # header on the redirect to the blob store (another host).
          echo '{}' > "$out/prev.json"
          runs=$(curl -fsS "${auth[@]}" \
            "$api/actions/workflows/code-security.yml/runs?branch=$default_branch&status=completed&exclude_pull_requests=true&per_page=20" \
            | jq -r --arg b "$default_branch" \
                '[.workflow_runs[] | select(.head_branch == $b and (.event | IN("push", "schedule", "workflow_dispatch"))
                   and .repository.id == .head_repository.id)] | sort_by(.created_at) | reverse | .[0:5][].id') || runs=""
          prev=""
          for run in $runs; do
            prev=$(curl -fsS "${auth[@]}" "$api/actions/runs/$run/artifacts?name=code-security-report" \
              | jq -r '[.artifacts[] | select((.expired | not) and .name == "code-security-report")][0].id // empty') || prev=""
            [ -n "$prev" ] && break
          done
          if [ -n "$prev" ] && curl -fsSL "${auth[@]}" -o "$out/prev.zip" "$api/actions/artifacts/$prev/zip"; then
            unzip -p "$out/prev.zip" report.json > "$out/prev.json" 2>/dev/null || echo '{}' > "$out/prev.json"
            jq -e 'type == "object"' "$out/prev.json" > /dev/null 2>&1 || echo '{}' > "$out/prev.json"
            echo "Carrying first_seen forward from artifact $prev"
          fi
          cat > "$out/summarise.jq" <<'JQ'
          # One code-security report from an Opengrep JSON report and a gitleaks JSON
          # report, carrying first_seen forward from the previous report.
          # Reads only rule id, severity, CWE, path, line and the rule message. Never
          # extra.lines, extra.metavars or extra.fingerprint (Opengrep), never Secret,
          # Match or Line (gitleaks), so no code and no secret value reaches the report.
          def clean: tostring | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ");
          def sev: {"ERROR": "high", "WARNING": "medium", "INFO": "low"}[. // ""] // "low";
          def cwe1: (if type == "array" then (.[0] // "") else (. // "") end) | tostring
            | ((capture("CWE-0*(?<n>[0-9]+)") | "CWE-\(.n)") // "");
          def rel: tostring | ltrimstr($root + "/") | ltrimstr("./");
          def lkey: "\(.tool)|\(.rule)|\(.path)";
          def xkey: "\(lkey)|\(.line)";
          def rank: {"critical": 0, "high": 1, "medium": 2, "low": 3}[.severity] // 9;

          ($og[0] // {}) as $o
          | ($gl[0] // [] | if type == "array" then . else [] end) as $g
          | ($prev[0] // {} | if type == "object" then . else {} end) as $p
          | (($now | fromdateiso8601) - 84 * 86400 | todateiso8601) as $cutoff
          | [($o.results // [])[]
              # A nosemgrep/noopengrep-suppressed result still appears in the JSON,
              # flagged is_ignored (SARIF marks it suppressions: inSource). Not a finding.
              | select((.extra.is_ignored // false) | not)
              | (.check_id | ltrimstr($prefix)) as $rule
              | {tool: "opengrep", rule: $rule,
                 severity: (.extra.severity | sev),
                 cwe: (.extra.metadata.cwe | cwe1),
                 path: (.path | rel), line: (.start.line // 0),
                 title: (if ($rule | startswith("generic.secrets.")) or ((.extra.metadata.technology // []) | index("secrets"))
                         then "Hard-coded secret: \($rule | split(".") | last)"
                         else (.extra.message // "" | clean | .[0:160]) end)}]
            as $ogf
          | [$g[]
              | {tool: "gitleaks", rule: (.RuleID // "unknown"), severity: "high", cwe: "CWE-798",
                 path: (.File // "" | rel), line: (.StartLine // 0),
                 title: "Secret: \(.RuleID // "unknown")"}]
            as $glf
          | ($ogf + $glf | unique_by(xkey)) as $all
          | ($p.findings // []) as $pf
          | ($pf | map({key: xkey, value: .first_seen}) | from_entries) as $exact
          | ($pf | group_by(lkey) | map({key: (.[0] | lkey), value: (map(.first_seen) | min)}) | from_entries) as $loose
          | ($all | map(. + {first_seen: ($exact[xkey] // $loose[lkey] // $now)}) | sort_by(rank, .path, .line)) as $cur
          | ($cur | map({key: lkey, value: true}) | from_entries) as $curset
          | [$pf[] | select($curset[lkey] | not) | {tool, rule, severity, cwe, path, line, first_seen, fixed_at: $now}] as $newly
          | (($p.closed // []) | map(select(.fixed_at >= $cutoff))) as $kept
          | {schema: 1, generated_at: $now}
            + $meta
            + {counts: {total: ($cur | length),
                        by_severity: ($cur | group_by(.severity) | map({key: .[0].severity, value: length}) | from_entries),
                        by_tool: ($cur | group_by(.tool) | map({key: .[0].tool, value: length}) | from_entries)},
               opengrep: {version: ($o.version // ""), errors: (($o.errors // []) | length),
                          files_scanned: (($o.paths.scanned // []) | length)},
               truncated: ([0, ($cur | length) - $max] | max),
               findings: $cur[0:$max],
               closed: ($kept + $newly | sort_by(.fixed_at) | reverse | .[0:2000])}
          JQ
          prefix="$(printf '%s' "$RUNNER_TEMP/cs-rules" | sed 's#^/##; s#/#.#g')."
          meta=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg db "$default_branch" --arg og "$OPENGREP_VERSION" --arg gl "$GITLEAKS_VERSION" \
            --arg rr "$OPENGREP_RULES_REF" --argjson rf "$CS_RULE_FILES" \
            '{repo: $repo, sha: $sha, ref: $ref, event: $event, run_id: ($run_id | tonumber),
              run_attempt: ($attempt | tonumber), run_url: $url, default_branch: $db,
              tools: {opengrep: $og, gitleaks: $gl, rules_ref: $rr, rule_files: $rf}}')
          jq -n --slurpfile og "$out/opengrep.json" --slurpfile gl "$out/gitleaks.json" \
            --slurpfile prev "$out/prev.json" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg prefix "$prefix" --arg root "$GITHUB_WORKSPACE" --argjson max 5000 \
            --argjson meta "$meta" -f "$out/summarise.jq" > "$out/report.json"
          # SARIF for people: rule ids without the temp-dir prefix, and no
          # snippet or match fingerprint (a hash of the matched text).
          jq --arg p "$prefix" 'walk(if type == "object" then del(.snippet, .fingerprints, .partialFingerprints)
              | (if (.ruleId | type) == "string" then .ruleId |= ltrimstr($p) else . end)
              | (if (.id | type) == "string" then .id |= ltrimstr($p) else . end) else . end)' \
            "$out/opengrep.sarif" > "$out/opengrep-sanitised.sarif"
          if [ "$GITHUB_REF" = "refs/heads/$default_branch" ]; then
            echo "retention=30" >> "$GITHUB_OUTPUT"
          else
            echo "retention=3" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### code-security"
            jq -r '"Opengrep \(.tools.opengrep), gitleaks \(.tools.gitleaks), \(.tools.rule_files) rule files, \(.opengrep.files_scanned) files scanned, \(.opengrep.errors) scan errors.",
                   "",
                   "| severity | findings |", "|---|---|",
                   (.counts.by_severity | to_entries[] | "| \(.key) | \(.value) |"),
                   "", "Total \(.counts.total); closed in the last 12 weeks \(.closed | length)."' "$out/report.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -c '{counts, opengrep, truncated}' "$out/report.json"

      - name: Upload report
        if: always() && steps.summarise.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: code-security-report
          path: ${{ runner.temp }}/code-security/report.json
          retention-days: ${{ steps.summarise.outputs.retention }}
          if-no-files-found: error

      - name: Upload SARIF
        if: always() && steps.summarise.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-sarif
          path: ${{ runner.temp }}/code-security/opengrep-sanitised.sarif
          retention-days: 7
          if-no-files-found: ignore

      - name: Gate
        if: env.CODE_SECURITY_GATE == 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/code-security/report.json"
          total=$(jq '.counts.total' "$report")
          [ "$total" -eq 0 ] && { echo "No findings."; exit 0; }
          jq -r '.findings[] | "::error file=\(.path),line=\(.line)::\(.tool) \(.rule) (\(.severity))"' "$report"
          echo "$total finding(s). Fix them, or mark a false positive with a nosemgrep comment / .gitleaksignore entry."
          exit 1
