# code-security: Opengrep (SAST) + gitleaks (secrets), reported to the
# household Code Security dashboard (Grafana, "Code Security").
#
# CANONICAL COPY: Dominus-Haus/k3s-playground ci-templates/code-security.yml.
# Each repo carries a copy at .github/workflows/code-security.yml, written by
# scripts/code-security/rollout-workflow.py, which only changes the cron
# minute, runs-on default and gate flag. Change the canonical copy, then roll
# it out; do not hand-edit a copy. (A copy rather than a reusable workflow:
# Dominus-Haus has no public repo, and only a public repo's workflow can be
# called from the other orgs.)
#
# HOW IT REPORTS. Nothing is pushed anywhere and the repo holds no secret. On
# the default branch the job uploads the artifact `code-security-report`
# (report.json: counts plus one row per finding with tool, rule id, severity,
# CWE, file:line, title and first_seen). The code-security-exporter
# (k3s-playground gitops/workloads/code-security) already reads every repo
# through its read-only GitHub App; it fetches the newest default-branch
# report and serves it as source="own_scan". Nothing goes through GitHub code
# scanning, so private repos need no Code Security licence.
#
# NO SECRET OR CODE LEAVES THE RUNNER. The report never carries a code
# snippet, an Opengrep `lines`/`metavars`/`fingerprint` field or a gitleaks
# Secret/Match/Line field; secret-rule titles are fixed strings. Neither tool
# prints findings to the log (Opengrep writes JSON to a file, gitleaks runs
# with --redact). The SARIF artifact `opengrep-sarif` is for people reading the
# run; it has snippets and match fingerprints stripped.
#
# first_seen survives across runs: each run reads the previous report of a
# trusted default-branch run (actions: read on the job token; see Summarise
# for what "trusted" means) and carries first_seen forward by
# (tool, rule, path, line), falling back to (tool, rule, path) when the line
# moved. A finding gone from (tool, rule, path) is listed under `closed` with
# fixed_at, kept 12 weeks, so the dashboard's burn-down works for own_scan.
#
# GATE. CODE_SECURITY_GATE 'true' fails the job on any finding, with one
# annotation per finding (rule and file:line only). That is the old
# Adams-Digital PR gate (gitleaks --exit-code 1 + semgrep --error). Default
# 'false': report only.
#
# PINS. Opengrep and gitleaks are release binaries pinned by version AND
# sha256 (Opengrep publishes no container image and no Action). Rules come
# from github.com/opengrep/opengrep-rules at a pinned commit: the fork of
# semgrep-rules taken before Semgrep relicensed its registry, licensed LGPL-2.1
# with the Commons Clause (use is fine; selling the rules as a service is not).
# Opengrep cannot fetch the Semgrep registry's p/... packs. RULES is
# p/security-audit + p/secrets, the packs the old Adams-Digital gate ran,
# resolved to the 263 rule files that carry all 277 of their rule ids at that
# commit (ids matched case-insensitively). Opengrep honours
# `nosemgrep`, `nosem` and `noopengrep` comments and `.semgrepignore`.
#
# RUNNER. arc-runner-org (the org's scale set on the home cluster) unless the
# org or repo variable CODE_SECURITY_RUNS_ON says otherwise (ubuntu-latest for
# an org with no scale set). The image needs only bash, curl, jq, tar, unzip
# and sha256sum, which both the ARC runner image and GitHub's ubuntu images
# carry.
name: code-security

on:
  schedule:
    # Daily. The rollout script staggers the minute per repo so a whole org's
    # scans do not queue on its two runners at once.
    - cron: '1 11 * * *'
  workflow_dispatch:
  # Only when this file changes: the PR that adds or bumps it proves it green
  # before merge (the house merge gate needs at least one check), and the push
  # that lands it writes the first report without waiting for the schedule.
  # A repo that gates on findings drops both path filters.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: security
    runs-on: ${{ vars.CODE_SECURITY_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Read the previous run's report artifact to carry first_seen forward.
      actions: read
    env:
      CODE_SECURITY_GATE: 'true'
      # Bump each version and its sha256 together.
      # https://github.com/opengrep/opengrep/releases (asset opengrep_manylinux_x86)
      OPENGREP_VERSION: v1.30.2
      OPENGREP_SHA256: a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7
      OPENGREP_RULES_REF: f1d2b562b414783763fd02a6ed2736eaed622efa
      # https://github.com/gitleaks/gitleaks/releases (gitleaks_<v>_linux_x64.tar.gz)
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The runner image ships no locale; the Python inside the Opengrep binary
      # then reads rule files as ASCII and dies on the first non-ASCII byte.
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Everything lands in RUNNER_TEMP, outside the checkout, so neither tool
      # scans the rules' own test fixtures (which are full of fake secrets).
      - name: Install Opengrep, gitleaks and the rules
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/cs-bin"
          mkdir -p "$bin" "$RUNNER_TEMP/cs-rules-src"
          curl -fsSL -o "$bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $bin/opengrep" | sha256sum -c -
          chmod +x "$bin/opengrep"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -fsSL "https://codeload.github.com/opengrep/opengrep-rules/tar.gz/${OPENGREP_RULES_REF}" \
            | tar -xz -C "$RUNNER_TEMP/cs-rules-src" --strip-components=1
          "$bin/opengrep" --version
          "$bin/gitleaks" version
          echo "$bin" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/code-security"
          rules="$RUNNER_TEMP/cs-rules"
          mkdir -p "$out" "$rules"
          # Every listed file must exist at the pinned commit: scanning with
          # silently fewer rules is the failure to avoid.
          # Each file goes under a directory named after its own stem. Opengrep
          # names a rule <directories>.<rule id>, so this makes it <path
          # stem>.<rule id>: the Semgrep registry id, which is what existing
          # `nosemgrep: <id>` comments name. Without it those comments stop
          # matching and every annotated line becomes a finding again.
          n=0
          while IFS= read -r f; do
            case "$f" in ''|'#'*) continue ;; esac
            test -f "$RUNNER_TEMP/cs-rules-src/$f" \
              || { echo "::error::rule file missing in opengrep-rules@${OPENGREP_RULES_REF}: $f"; exit 1; }
            mkdir -p "$rules/${f%.*}"
            cp "$RUNNER_TEMP/cs-rules-src/$f" "$rules/${f%.*}/${f##*/}"
            n=$((n + 1))
          done <<'RULES'
          c/lang/security/double-free.yaml
          c/lang/security/insecure-use-gets-fn.yaml
          c/lang/security/insecure-use-printf-fn.yaml
          c/lang/security/insecure-use-scanf-fn.yaml
          c/lang/security/insecure-use-strcat-fn.yaml
          c/lang/security/insecure-use-string-copy-fn.yaml
          c/lang/security/insecure-use-strtok-fn.yaml
          c/lang/security/random-fd-exhaustion.yaml
          c/lang/security/use-after-free.yaml
          dockerfile/security/last-user-is-root.yaml
          generic/html-templates/security/unquoted-attribute-var.yaml
          generic/html-templates/security/var-in-href.yaml
          generic/html-templates/security/var-in-script-tag.yaml
          generic/nginx/security/alias-path-traversal.yaml
          generic/nginx/security/dynamic-proxy-host.yaml
          generic/nginx/security/dynamic-proxy-scheme.yaml
          generic/nginx/security/header-injection.yaml
          generic/nginx/security/header-redefinition.yaml
          generic/nginx/security/insecure-redirect.yaml
          generic/nginx/security/insecure-ssl-version.yaml
          generic/nginx/security/missing-internal.yaml
          generic/nginx/security/missing-ssl-version.yaml
          generic/secrets/security/detected-amazon-mws-auth-token.yaml
          generic/secrets/security/detected-artifactory-password.yaml
          generic/secrets/security/detected-artifactory-token.yaml
          generic/secrets/security/detected-aws-access-key-id-value.yaml
          generic/secrets/security/detected-aws-appsync-graphql-key.yaml
          generic/secrets/security/detected-aws-secret-access-key.yaml
          generic/secrets/security/detected-aws-session-token.yaml
          generic/secrets/security/detected-bcrypt-hash.yaml
          generic/secrets/security/detected-codeclimate.yaml
          generic/secrets/security/detected-etc-shadow.yaml
          generic/secrets/security/detected-facebook-access-token.yaml
          generic/secrets/security/detected-facebook-oauth.yaml
          generic/secrets/security/detected-google-gcm-service-account.yaml
          generic/secrets/security/detected-google-oauth-access-token.yaml
          generic/secrets/security/detected-heroku-api-key.yaml
          generic/secrets/security/detected-hockeyapp.yaml
          generic/secrets/security/detected-mailchimp-api-key.yaml
          generic/secrets/security/detected-mailgun-api-key.yaml
          generic/secrets/security/detected-npm-registry-auth-token.yaml
          generic/secrets/security/detected-onfido-live-api-token.yaml
          generic/secrets/security/detected-outlook-team.yaml
